  eo_14289_non_stacking:
    citation: "Executive Order 14289 of April 29, 2025 — Addressing Certain Tariffs on Imported Articles"
    federal_register: "90 FR 18907"
    fr_document_number: "2025-07835"
    signed_date: "2025-04-29"
    publication_date: "2025-05-02"
    statute: "3 U.S.C. 301; 19 U.S.C. 1862; 50 U.S.C. 1701 et seq."
    applies_to: [s232_auto, s232_steel, s232_aluminum, ieepa_fent_canada, ieepa_fent_mexico]
    verified_against: "https://www.federalregister.gov/documents/2025/05/02/2025-07835/addressing-certain-tariffs-on-imported-articles"
    verified: true
    verification_scope: "full operative text retrieved and quoted in docs/stacking_legal_model.md"
    status_note: >
      Sec. 3(a) sets the non-stacking precedence: (i) an article subject to Proc
      10908 (autos) is not subject to IEEPA Canada/Mexico or §232 aluminum/steel;
      (ii) an article subject to IEEPA Canada/Mexico is not subject to §232
      aluminum/steel; (iii) §232 aluminum and steel EXPLICITLY stack with each
      other. Sec. 3(b): exclusion suppresses the rate, not the classification.
      Sec. 3(c)/4(b): Column 1 HTSUS, §301, EO 14195 fentanyl and AD/CVD remain
      cumulative. EO 14257 (IEEPA reciprocal) is absent from sec. 2 and is
      therefore outside the order.

  fr_2025_09066_eo14289_implementation:
    citation: "Notice of Implementation of Addressing Certain Tariffs on Imported Articles Pursuant to the President's Executive Order 14289"
    federal_register: "90 FR 21487"
    fr_document_number: "2025-09066"
    publication_date: "2025-05-20"
    agency: "U.S. Customs and Border Protection / Department of Homeland Security"
    applies_to: [s232_auto, s232_steel, s232_aluminum, ieepa_fent_canada, ieepa_fent_mexico]
    verified_against: "https://www.federalregister.gov/documents/2025/05/20/2025-09066/notice-of-implementation-of-addressing-certain-tariffs-on-imported-articles-pursuant-to-the"
    verified: true
    verification_scope: "authority metadata and HTS implementation"

  cbp_csms_65054270_non_stacking:
    citation: "CBP CSMS #65054270 — Guidance on tariff prioritization for articles subject to more than one action under Executive Order 14289"
    publication_date: "2025-05-15"
    agency: "U.S. Customs and Border Protection"
    applies_to: [s232_auto, s232_steel, s232_aluminum, ieepa_fent_canada, ieepa_fent_mexico]
    verified_against: "https://content.govdelivery.com/accounts/USDHSCBP/bulletins/3e0a63e"
    verified: true
    verification_scope: >
      Bulletin retrieved directly from CBP GovDelivery 2026-07-30. All four
      load-bearing claims confirmed verbatim against the primary source, not via
      trade-counsel summaries.
    quotes:
      subject_to_definition: >
        "'Subject to' means that duty more than 0% is owed under the tariff action."
      prioritization_order: >
        Filers calculate in sequence: (1) 232 Auto/Auto Parts;
        (2) IEEPA Canada or IEEPA Mexico; (3) 232 Aluminum and/or 232 Steel.
      usmca_parts: >
        "Parts of passenger vehicles and light trucks that qualify for
        preferential treatment under United States-Mexico-Canada Agreement
        (USMCA), ARE NOT subject to the 232 Auto/Auto Parts tariff or the IEEPA
        Canada or IEEPA Mexico tariff."
      retroactivity: >
        Applies "retroactively to entries of merchandise subject to the five
        applicable tariff measures and entered for consumption or withdrawn from
        warehouse for consumption on or after March 4, 2025."
    status_note: >
      The >0% definition is the threshold that drives the whole order, and the
      reason USMCA-qualifying auto parts (0% under Proc 10908) fall through to
      the §232 steel/aluminum step without a special rule. Note CBP states the
      USMCA carve-out as a direct exemption from steps 1 and 2; our model reaches
      the same result from the >0% definition alone, so the two readings agree
      on outcome and we do not encode a separate USMCA branch.

