note: >
  Curated legal-authority reference layer. verified=true means the authority
  metadata, citation, Federal Register citation, document number, and source
  pointer were verified against official U.S. government sources where available.
  verified=true does not mean the duty is currently active. Current applicability,
  effective dates, suspension, termination, exclusions, and litigation status must
  be handled by a separate status/effective-date layer.

