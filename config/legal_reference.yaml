# =============================================================================
# IEEPA refund / recovery layer (4-layer status model)
# =============================================================================
# Rendered in the frontend Flags and the "why SAIL differs from broker" section.
# PHRASING IS LOAD-BEARING and legally reviewed — do not overstate: do NOT state
# a dollar figure in the UI; refunds are NOT automatic and NOT guaranteed; the
# scope of relief for finally liquidated entries is being litigated.
# Four layers: (1) duty authority [the EOs above], (2) ended-collection status,
# (3) refund process (CBP CAPE / PSC / protest), (4) litigation risk.
# Edit THIS block (the source of truth), then run scripts/emit_frontend_bundles.sh.
# Do NOT hand-edit the generated constants/*.json (see docs/PROVENANCE_PIPELINE.md).
ieepa_refund:
  ended_effective_date: '2026-02-24'
  covered_reasons:
  - ieepa_recip_active
  - ieepa_recip_floor
  - ieepa_fent_china
  - ieepa_fent_canada
  - ieepa_fent_mexico
  authorities:
  - eo_14389_ending_ieepa_tariffs
  - cbp_csms_67834313_ieepa_end_collection
  - cbp_csms_68340863_cape_refund
  status:
    verified: true
    headline: IEEPA additional duties have ended
    summary: |
      IEEPA additional ad valorem duties (the reciprocal action and the fentanyl and border actions) are no longer collected on goods entered or withdrawn for consumption on or after February 24, 2026, under Executive Order 14389 and CBP CSMS #67834313. The IEEPA Chapter 99 numbers became inactive in ACE on that date. This does not affect Section 232 or Section 301 duties. SAIL still shows the IEEPA line for periods when it was lawfully in force and collected.
    source: 'EO 14389 (91 FR 9437); CBP CSMS #67834313'
  refund_process:
    verified: true
    headline: CBP has a streamlined refund path (CAPE)
    summary: |
      Where IEEPA duties were paid, CBP created Consolidated Administration and Processing of Entries (CAPE) in ACE to consolidate IEEPA duty refunds and interest for importers of record who paid them.
    steps:
    - 'File a CAPE declaration: the importer of record, or the broker that filed the
      entry summaries, submits a CSV of up to 9,999 entry numbers. CBP validates that
      each entry exists in ACE and carries at least one IEEPA Chapter 99 number.'
    - CBP removes the IEEPA Chapter 99 lines at the entry-summary-line level, recalculates
      duties as if IEEPA were never owed, and computes interest under 19 CFR 24.36.
    - For eligible unliquidated entries, CBP expects to issue valid refunds within
      roughly 60 to 90 days of accepting the CAPE declaration, unless it needs further
      review.
    - Outside CAPE, an unliquidated entry can be corrected by a Post-Summary Correction
      (PSC), and a liquidated entry can be protested within 180 days under 19 U.S.C.
      1514.
    caveat: |
      CAPE Phase 1 excludes some entries, including reconciliation entries, drawback-related entries, entries with open or suspended protests, certain AD/CVD entries pending liquidation, and entry summaries more than 80 days past liquidation. Refunds are not automatic and are not guaranteed; eligibility and amount depend on liquidation status, timeliness, and documentation.
    source: CBP CAPE refund guidance
  litigation_risk:
    verified: false
    headline: Refund scope is subject to active litigation
    summary: |
      The scope of refund relief for certain finally liquidated entries is being litigated, particularly where the importer did not file its own action at the Court of International Trade (CIT).
    implication: |
      Treat refunds on protected entries (unliquidated, timely protested, or covered by the importer's own CIT action) as likely but contingent, and finally liquidated entries with no individual action as at risk.
    source: Ongoing CIT and appellate proceedings
  ui:
    flag_label: IEEPA duty has ended; a refund may apply
    flag_detail: |
      SAIL applied the IEEPA additional duty for this period because it was in force then. Collection ended for entries on or after February 24, 2026 (EO 14389; CBP CSMS #67834313). Where IEEPA duty was paid, a refund may be available through CBP's CAPE process. Refunds are not automatic or guaranteed, and the scope of relief for finally liquidated entries is being litigated.
    broker_diff: |
      SAIL shows the IEEPA line for the period it was in force, at the statutory rate. If the broker did not bill IEEPA on a covered entry, that is consistent with an exemption or the post February 24, 2026 wind-down. If the broker did bill it, the duty may be recoverable through CAPE, a PSC, or a protest.
    pill_active_period: applied; in force this period
    pill_ended: collection ended Feb 24, 2026

