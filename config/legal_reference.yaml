    citation: "CBP: Consolidated Administration and Processing of Entries (CAPE) for IEEPA duty refunds"
    publication_date: null
    agency: "U.S. Customs and Border Protection"
    applies_to: [ieepa_recip_active, ieepa_fent_china, ieepa_fent_canada, ieepa_fent_mexico]
    verified: true
    verified_against: "https://content.govdelivery.com/accounts/USDHSCBP/bulletins/412cc7f"
    verification_scope: "CBP CAPE refund-process guidance"
    status_note: "CBP created CAPE in ACE to consolidate IEEPA duty refunds and interest for importers of record who paid them. A CAPE declaration may be filed by the importer of record or the broker that filed the entry summaries (a CSV of up to 9,999 entry numbers); CBP removes the IEEPA Chapter 99 lines, recalculates duties as if IEEPA were never owed, and computes interest under 19 CFR 24.36. Refunds are not automatic and are not guaranteed."

