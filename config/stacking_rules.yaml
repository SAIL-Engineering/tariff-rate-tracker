# =============================================================================
# stacking_rules.yaml — how duties combine, by era
# =============================================================================
# Legacy aggregate-model stacking, exclusion and replacement configuration.
# Executable shipment decisions are compiled from source-bound rule fragments.
# The reviewed legal reading behind every rule here is docs/stacking_legal_model.md
# — change that document first, then this file, then the code.
#
# Three relationships are expressible:
#   stacks      both duties owed, additively
#   excludes    higher-precedence action applies; the other is NOT owed at all
#   replaces    the duty substitutes for the base rate (not additional)
#
# The ORIGINAL "subject to" test was defined by CBP as: MORE THAN 0% owed on
# that action. This definition is load-bearing — it is what makes a
# USMCA-qualifying auto part (0% under Proc 10908) fall through the auto step to
# the steel/aluminum step without needing a special case.
# Proclamation 10984 clause 9 changes the vehicle test from November 1, 2025.
# src/section232_stacking.py implements that dated shipment decision. This
# aggregate approximation lacks separately modeled action-applicability inputs
# and must not be used as a shipment interpreter or evidence of legal absence.
# =============================================================================

version: 2

# --- Authority keys -----------------------------------------------------------
# Maps a stacking-model authority to the rate column that carries it. §232 is
# split per ACTION because EO 14289 operates on distinct actions: with a single
# collapsed rate_232 neither "auto excludes steel" nor "aluminum and steel both
# apply" is expressible.
authorities:
  s232_auto:        rate_232_auto
  s232_steel:       rate_232_steel
  s232_aluminum:    rate_232_aluminum
  s232_copper:      rate_232_copper
  s232_other:       rate_232_other        # wood, MHD, semiconductors
  ieepa_canada:     rate_ieepa_fent       # EO 14193 — carried on the fentanyl column
  ieepa_mexico:     rate_ieepa_fent       # EO 14194 — ditto; disambiguated by country
  ieepa_fentanyl:   rate_ieepa_fent       # EO 14195 (PRC) — NOT in EO 14289 scope
  ieepa_reciprocal: rate_ieepa_recip      # EO 14257 — NOT in EO 14289 scope
  s301:             rate_301
  s301_forced_labor: rate_s301fl
  s301_brazil:      rate_s301br
  s122:             rate_s122
  s201:             rate_section_201
  s338:             rate_s338
  adcvd:            rate_adcvd
  other:            rate_other

# Origin predicates distinguish actions sharing one legacy numeric column.
authority_countries:
  ieepa_canada: ['1220']
  ieepa_mexico: ['2010']
  ieepa_fentanyl: ['5700', '5820']  # EO 14195 / HTS note 2(u), China and Hong Kong

# --- Base-rate replacement ----------------------------------------------------
# These REPLACE the Column 1 General base rate rather than adding to it.
# Chapter 99 additional duties then stack on top of the replaced base.
base_replacement:
  column2:
    # HTSUS General Note 3(b). Non-NTR origins are dutiable at Column 2, which
    # substitutes for Column 1 General. Rates are frequently an order of
    # magnitude higher (2921.46.00: Free on col 1, 15.4c/kg + 149.5% on col 2).
    source: 'resources/gn3_column2_countries.csv'   # parsed from GN 3, per revision
    rate_column: rate_column2
    reason_code: base_col2                          # config/duty_citations.yaml
    citation_key: gn3_column2_non_ntr
  mtb_9902:
    # Subchapter II MTB suspensions: "subject to duty at the rate set forth
    # herein IN LIEU OF the rate provided therefor in chapters 1 to 97".
    # Downward replacement. Not yet wired into the rate math — candidate only.
    modelled: false
    citation_key: null   # TODO register subchapter II note 1 when MTB is modelled

# --- Eras ---------------------------------------------------------------------
# Selected by the revision's effective date. `from` is inclusive; the era runs
# until the next era's `from`. Rules are evaluated in `precedence` order and the
# FIRST matching group wins, mirroring EO 14289 sec. 3(a)(i) then (ii) then (iii).
eras:

  - id: legacy
    from: '1900-01-01'
    label: 'Pre-EO-14289: no non-stacking order'
    # Everything stacks additively. The old metal-content nonmetal_share split
    # applied here; it is a modelling approximation, not a legal rule.
    non_stacking: []
    always_cumulative: [s301, s201, adcvd, other]

  - id: eo14289
    from: '2025-03-04'      # CBP applies the order to ENTRIES on/after this date,
                            # which precedes both the EO signature (2025-04-29)
                            # and its HTS implementation — deliberately retroactive.
    label: 'EO 14289 non-stacking order'
    citation_keys:
      - eo_14289_non_stacking                  # 90 FR 18907 — the operative order
      - fr_2025_09066_eo14289_implementation   # 90 FR 21487 — HTS implementation
      - cbp_csms_65054270_non_stacking         # "subject to" = >0% owed
    subject_to_threshold: 0.0   # "subject to" = rate strictly greater than this
    non_stacking:
      # sec. 3(a)(i)
      - precedence: 1
        action: s232_auto
        rule_id: eo14289_3a_i_auto
        excludes: [ieepa_canada, ieepa_mexico, s232_aluminum, s232_steel]
        citation_key: eo_14289_non_stacking
        cite_locator: 'sec. 3(a)(i)'
      # sec. 3(a)(ii)
      - precedence: 2
        action: [ieepa_canada, ieepa_mexico]
        rule_id: eo14289_3a_ii_ieepa_camx
        excludes: [s232_aluminum, s232_steel]
        citation_key: eo_14289_non_stacking
        cite_locator: 'sec. 3(a)(ii)'
    mutually_stacking:
      # sec. 3(a)(iii) — aluminum and steel EXPLICITLY stack with each other.
      # A derivative containing both owes duty on BOTH contents.
      - actions: [s232_aluminum, s232_steel]
        citation_key: eo_14289_non_stacking
        cite_locator: 'sec. 3(a)(iii)'
    # sec. 3(c) + sec. 4(b): actions NOT listed in EO 14289 sec. 2 are cumulative
    # and are never suppressed by the order.
    always_cumulative:
      [s301, ieepa_fentanyl, ieepa_reciprocal, adcvd, s201, s232_copper,
       s232_other, other]
    # sec. 3(b): exclusion suppresses the RATE, not the classification. A
    # suppressed action stays visible in provenance at 0 with a reason.
    suppressed_rows_retain_provenance: true

  - id: proc10947
    from: '2025-06-04'
    effective_at: '2025-06-04T00:01:00-04:00'
    label: 'Proc. 10947 clause (5): metals precede IEEPA Canada/Mexico'
    inherits: eo14289
    citation_keys: [eo_14289_non_stacking, proc_10947_stacking_amendment]
    non_stacking:
      - precedence: 1
        action: s232_auto
        rule_id: eo14289_3a_i_auto
        excludes: [ieepa_canada, ieepa_mexico, s232_aluminum, s232_steel]
        citation_key: eo_14289_non_stacking
        cite_locator: 'sec. 3(a)(i)'
      - precedence: 2
        action: [s232_aluminum, s232_steel]
        rule_id: proc10947_5_metals
        excludes: [ieepa_canada, ieepa_mexico]
        citation_key: proc_10947_stacking_amendment
        cite_locator: 'clause (5), amended EO 14289 sec. 3(a)(ii)'

  - id: proc10962
    from: '2025-08-01'
    effective_at: '2025-08-01T00:01:00-04:00'
    label: 'Proc. 10962 clause (5): auto action also excludes copper'
    inherits: proc10947
    always_cumulative: [s301, ieepa_fentanyl, ieepa_reciprocal, adcvd, s201, s232_other, other]
    non_stacking:
      - precedence: 1
        action: s232_auto
        rule_id: eo14289_3a_i_auto
        excludes: [ieepa_canada, ieepa_mexico, s232_aluminum, s232_steel]
        citation_key: eo_14289_non_stacking
        cite_locator: 'sec. 3(a)(i)'
      - precedence: 2
        action: s232_auto
        rule_id: proc10962_5_auto
        excludes: [s232_copper]
        citation_key: proc_10962_copper_stacking
        cite_locator: 'clause (5)'
      - precedence: 3
        action: [s232_aluminum, s232_steel]
        rule_id: proc10947_5_metals
        excludes: [ieepa_canada, ieepa_mexico]
        citation_key: proc_10947_stacking_amendment
        cite_locator: 'clause (5), amended EO 14289 sec. 3(a)(ii)'

  - id: post_ieepa
    from: '2026-02-24'
    effective_at: '2026-02-24T00:00:00-05:00'
    label: 'IEEPA collection ends under CBP CSMS 67834313'
    inherits: proc10962
    # With ieepa_* at 0 they are no longer "subject to" anything, so steps 1 and 2
    # of the order stop firing on their account automatically.
    zeroed: [ieepa_reciprocal, ieepa_fentanyl, ieepa_canada, ieepa_mexico]
    citation_keys: [eo_14389_ending_ieepa_tariffs, cbp_csms_67834313_ieepa_end_collection]

  - id: s122
    from: '2026-02-24'
    effective_at: '2026-02-24T00:01:00-05:00'
    label: 'Section 122 balance-of-payments surcharge window'
    inherits: post_ieepa
    operative_until: '2026-07-24T00:01:00-04:00'
    window_closes: '2026-07-23'    # 150-day statutory limit
    citation_keys: [s122_balance_of_payments, proc_11012_s122_surcharge,
                    cbp_csms_67844987_s122_implementation]
    always_cumulative_add: [s122]

  - id: s232_annex
    from: '2026-04-06'
    effective_at: '2026-04-06T00:01:00-04:00'
    label: 'Section 232 annex regime — duty on full customs value'
    inherits: s122
    # The April 2026 proclamation applies §232 to the full customs value,
    # retiring metal-content-based mutual exclusion. Annex II products are
    # REMOVED from §232 scope entirely and therefore are not "subject to" it.
    metal_content_scaling: false

  - id: s301_2026
    from: '2026-07-22'
    label: 'Section 301 Brazil (note 50); forced labor 60 economies (note 52) from 07-24'
    inherits: s232_annex
    always_cumulative_add: [s301_brazil, s301_forced_labor]
    # Both note 50(a) and note 52(a) state the duty applies IN ADDITION to any
    # other duty in the subchapter, so an origin can owe both (Brazil pays 25%
    # under note 50 plus 12.5% under note 52).

  - id: s338
    from: '2026-08-22'
    effective_at: '2026-08-22T00:01:00-04:00'
    label: 'Section 338 Canada, following Proc. 11056 postponement'
    inherits: s301_2026
    always_cumulative_add: [s338]
    # Proclamation 11047 para. 2: "in addition to any other duties" — but does
    # NOT apply to articles subject to §232, nor to WTO civil-aircraft articles
    # (excluding unmanned aircraft). Those are full per-article exclusions,
    # already implemented in compute_s338_rates().
