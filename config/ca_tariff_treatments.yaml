# =============================================================================
# Canada — origin↔treatment mapping for the derived duty-rates build
# =============================================================================
# The TPHS table carries the RATE per treatment column but NOT which origins
# each treatment covers. That mapping is the Customs Tariff (S.C. 1997, c.36)
# Schedule "List of Countries and Applicable Tariff Treatments", published
# annually by CBSA (the T-list; also reproduced in Memorandum D11-4-3).
#
# This YAML is the single source of truth (same pattern as duty_citations.yaml);
# build_duty_rates.py emits the committed JSON from it. Review annually against
# the CBSA T-list publication. valid_from/valid_until let an accession be an
# APPEND, never an edit.
#
# `conditional: true` = entitlement carries rules-of-origin / direct-shipment
# conditions (all preferential treatments do formally; the flag marks the ones
# whose ORIGIN LIST itself is conditional or graduated — GPT/LDCT/CCCT).
# `transcription_pending: true` = the member list below is seeded from public
# knowledge and MUST be verified against the current CBSA T-list before this
# treatment's rows are presented as authoritative.
#
# General Tariff is NOT enumerated: it applies when the origin appears in no
# other list (i.e. no MFN entitlement — in practice North Korea).
treatments:
  MFN:
    name: Most-Favoured-Nation Tariff
    applies: all_wto_and_entitled            # default treatment for nearly every origin
    conditional: false
    legal_basis: "Customs Tariff s.29; WTO"
  AUT:  { name: Australia Tariff,     origin_countries: [AU], conditional: false, legal_basis: "Customs Tariff s.34 (CANZ)" }
  NZT:  { name: New Zealand Tariff,   origin_countries: [NZ], conditional: false, legal_basis: "Customs Tariff s.35" }
  UST:  { name: United States Tariff, origin_countries: [US], conditional: false, legal_basis: CUSMA }
  MXT:  { name: Mexico Tariff,        origin_countries: [MX], conditional: false, legal_basis: CUSMA }
  CIAT: { name: Canada-Israel Agreement Tariff, origin_countries: [IL], conditional: false, legal_basis: CIFTA }
  CT:   { name: Chile Tariff,         origin_countries: [CL], conditional: false, legal_basis: CCFTA }
  CRT:  { name: Costa Rica Tariff,    origin_countries: [CR], conditional: false, legal_basis: CCRFTA }
  IT:   { name: Iceland Tariff,       origin_countries: [IS], conditional: false, legal_basis: CEFTA }
  NT:   { name: Norway Tariff,        origin_countries: ["NO"], conditional: false, legal_basis: CEFTA }
  SLT:  { name: Switzerland-Liechtenstein Tariff, origin_countries: [CH, LI], conditional: false, legal_basis: CEFTA }
  PT:   { name: Peru Tariff,          origin_countries: [PE], conditional: false, legal_basis: CPFTA }
  COLT: { name: Colombia Tariff,      origin_countries: [CO], conditional: false, legal_basis: CCOFTA }
  JT:   { name: Jordan Tariff,        origin_countries: [JO], conditional: false, legal_basis: CJFTA }
  PAT:  { name: Panama Tariff,        origin_countries: [PA], conditional: false, legal_basis: CPAFTA }
  HNT:  { name: Honduras Tariff,      origin_countries: [HN], conditional: false, legal_basis: CHFTA }
  KRT:  { name: Korea Tariff,         origin_countries: [KR], conditional: false, legal_basis: CKFTA }
  UAT:  { name: Ukraine Tariff,       origin_countries: [UA], conditional: false, legal_basis: CUFTA }
  UKT:  { name: United Kingdom Tariff, origin_countries: [GB], conditional: false, legal_basis: "Canada-UK TCA" }
  CEUT:
    name: Canada-European Union Tariff
    origin_countries: [AT, BE, BG, CY, CZ, DE, DK, EE, ES, FI, FR, GR, HR, HU,
                       IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK]
    conditional: false
    legal_basis: CETA
  CPTPT:
    name: Comprehensive and Progressive Trans-Pacific Partnership Tariff
    origin_countries: [AU, BN, CL, JP, MX, MY, NZ, PE, SG, VN]
    conditional: false
    legal_basis: CPTPP
    verified_against: "CBSA T2026 List of Countries and Applicable Tariff Treatments, fetched 2026-08-27"
  CCCT:
    name: Commonwealth Caribbean Countries Tariff
    origin_countries: [AG, AI, BB, BM, BS, BZ, DM, GD, GY, JM, KN, KY, LC, MS, TC, TT, VC, VG]
    conditional: true
    legal_basis: CARIBCAN
    verified_against: "CBSA T2026 List of Countries and Applicable Tariff Treatments, fetched 2026-08-27"
  GPT:
    name: General Preferential Tariff
    origin_countries: [AF, AI, AO, BD, BF, BI, BJ, BO, BT, CC, CD, CF, CG, CI, CK, CM, CV, CX, DJ, EA, EG, ER, ET, FK, FM, GH, GM, GN, GW, HN, HT, IC, IO, KE, KG, KH, KI, KM, LA, LB, LK, LR, LS, MA, MG, ML, MM, MN, MR, MS, MW, MZ, NE, NF, NG, NI, NP, NU, PG, PH, PK, PN, RW, SB, SD, SH, SL, SN, SO, SS, ST, SV, SY, SZ, TD, TF, TG, TJ, TK, TL, TN, TZ, UA, UG, UZ, VU, WS, YE, ZM, ZW]
    conditional: true
    legal_basis: "Customs Tariff s.33"
    verified_against: "CBSA T2026 List of Countries and Applicable Tariff Treatments, fetched 2026-08-27"
  LDCT:
    name: Least Developed Country Tariff
    origin_countries: [AF, AO, BD, BF, BI, BJ, BT, CD, CF, DJ, ER, ET, GM, GN, GW, HT, KH, KI, KM, LA, LR, LS, MG, ML, MM, MR, MW, MZ, NE, NP, RW, SB, SD, SL, SN, SO, SS, ST, TD, TG, TL, TZ, UG, YE, ZM]
    conditional: true
    legal_basis: "Customs Tariff s.38"
    verified_against: "CBSA T2026 List of Countries and Applicable Tariff Treatments, fetched 2026-08-27"
  General Tariff:
    name: General Tariff
    applies: no_other_entitlement
    conditional: false
    legal_basis: "Customs Tariff s.29(1) — 35% fallback"
    no_mfn_origins_note: "Per the T2026 list, Belarus and Russia have no MFN entitlement (withdrawn 2022) — the General Tariff applies to them."
