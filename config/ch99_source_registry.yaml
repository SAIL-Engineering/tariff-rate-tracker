algorithm:
  - "Resolve entry/withdrawal date; separately track shipment date only for in-transit exceptions."
  - "Load the HTS revision active on that date, including Chapter 1-97, General Notes, Additional U.S. Notes, and Chapter 99."
  - "Run a full Chapter 99 sweep across every active rule, not a named-program subset."
  - "Match by HTS, origin, export country, material composition/value, end-use, component value, quota status, company/certification status, and effective date."
  - "If a rule may apply but facts are missing, output 'potentially applicable / requires additional facts' rather than silently excluding it."
  - "Apply stacking, non-stacking, replacement, exemption, Chapter 98, drawback, and FTZ rules."
  - "In HTS determination, show published legal rate and duty basis; compute dollars only in landed-cost/scenario layer."
