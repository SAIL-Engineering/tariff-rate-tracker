# SAIL GTX — U.S. Chapter 99 / Program Duty Source Registry
# Created: 2026-06-11
# Purpose: Legal/source map for an automated, revision-specific Chapter 99 sweep.
# Principle: show published legal rates and duty bases in HTS determination; perform dollars/ad-valorem-equivalent only in landed-cost layer.

metadata:
  jurisdiction: US
  area: HTSUS Chapter 99, trade remedies, temporary modifications, quotas, special program duties
  generated_on: 2026-06-11
  warning: >
    Chapter 99 changes frequently. This is a source registry and determination checklist, not a static rate table.
    The exhaustive implementation is to ingest the full current and historical HTS Chapter 99 text by revision and
    reconcile it to Federal Register, CBP CSMS, CBP FAQs, CBP quota bulletins, USTR, and Commerce/AD-CVD sources.

