name: frontend-bundles-fresh

# Fail a PR if the committed frontend bundles (constants/dutyCitations.json,
# legalRefs.json) no longer match what the YAML source generates — i.e. someone
# edited config/*.yaml without re-running the generators. See
# docs/PROVENANCE_PIPELINE.md.
on:
  pull_request:
    paths:
      - 'config/duty_citations.yaml'
      - 'config/legal_reference.yaml'
      - 'resources/ch99_legal_refs.csv'
      - 'frontend/public/data/duty_citations.json'
      - 'frontend/public/data/legal_refs.json'
      - 'scripts/emit_duty_citations.R'
      - 'scripts/emit_legal_refs_json.R'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R deps
        run: >
          Rscript -e 'install.packages(c("tidyverse","yaml","jsonlite","here"),
          repos = "https://cloud.r-project.org")'

      - name: Regenerate bundles + verify the committed copies are up to date
        run: |
          Rscript scripts/emit_duty_citations.R
          Rscript scripts/emit_legal_refs_json.R
          if ! git diff --exit-code -- \
              frontend/public/data/duty_citations.json \
              frontend/public/data/legal_refs.json; then
            echo "::error::Committed bundles are stale vs config/*.yaml."
            echo "Run scripts/emit_frontend_bundles.sh and commit the regenerated JSON in BOTH repos."
            exit 1
          fi
          echo "Bundles are in sync with the YAML."
