name: HTS Revision Update

# Nightly multi-jurisdiction HTS rollout.
#
#   For each of US / CA / EU (serially): ask the upstream source whether a
#   revision newer than the one registered in Supabase exists
#   (refresh.py --if-new); if yes, run the SAME orchestrator the laptop runs —
#   scripts/hts_automation/refresh.py --jurisdiction <JUR> — which downloads
#   the schedule, builds the corpus, publishes to Pinecone, registers in
#   Supabase, and commits the built JSON to sail-gtx-prerelease (from whose
#   production branch Railway + Vercel auto-deploy). The US leg additionally
#   updates Railway/Vercel env vars and smoke-tests, rolling env vars back
#   itself on smoke failure.
#
# Triggers:
#   - cron "0 6,7 * * 1-5" → weekdays (Mon-Fri), 2 AM US-Eastern in both DST
#     regimes; anything published over a weekend is picked up Monday; the
#     second run queues behind the first (concurrency) and its gates no-op.
#   - workflow_dispatch   → manual run for one or all jurisdictions.

on:
  schedule:
    # GitHub cron is UTC-only, so 07:00 UTC is 2 AM EST but 3 AM EDT — both
    # hours are scheduled so the run lands at 2 AM Eastern year-round, and
    # 1-5 restricts it to Monday-Friday (6-7 UTC on a weekday IS the same
    # weekday in Eastern). The --if-new gate exits clean when nothing
    # changed, so the redundant run costs a page-scrape, and `concurrency`
    # prevents overlap.
    - cron: '0 6,7 * * 1-5'
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: 'Which jurisdiction(s) to run'
        type: choice
        options: [all, US, CA, EU, GB, XI]
        default: all
      revision_id:
        description: 'US only — roll out this revision instead of gating on latest (CBSA/TARIC fetchers always take the latest upstream)'
        required: false
        default: ''
      dry_run:
        description: 'Run in dry-run mode (no external writes)'
        type: boolean
        default: false
      skip_smoke_classify:
        description: 'US only — skip the canary POST /api/classify in smoke test'
        type: boolean
        default: true

permissions:
  contents: write      # commit registry CSVs back to this repo
  issues: write        # open an issue on failure

concurrency:
  group: hts-revision-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false     # an EU failure must not cancel the CA leg
      max-parallel: 1      # serial legs: no race on the sail-gtx push or this repo's commit-back
      # On dispatch, honor the jurisdiction picker; on schedule, run all three.
      # (The picker must shape the matrix itself — the `matrix` context is not
      # available in a job-level `if`.)
      matrix:
        include: ${{ (github.event_name != 'workflow_dispatch' || inputs.jurisdiction == 'all') && fromJSON('[{"jurisdiction":"US","timeout":45},{"jurisdiction":"CA","timeout":60},{"jurisdiction":"EU","timeout":90},{"jurisdiction":"GB","timeout":75},{"jurisdiction":"XI","timeout":90}]') || fromJSON('{"US":[{"jurisdiction":"US","timeout":45}],"CA":[{"jurisdiction":"CA","timeout":60}],"EU":[{"jurisdiction":"EU","timeout":90}],"GB":[{"jurisdiction":"GB","timeout":75}],"XI":[{"jurisdiction":"XI","timeout":90}]}')[inputs.jurisdiction] }}

    env:
      PINECONE_API_KEY:        ${{ secrets.PINECONE_API_KEY }}
      SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RAILWAY_TOKEN:           ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID:      ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID:      ${{ secrets.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT_ID:  ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
      VERCEL_TOKEN:            ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID:       ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID:          ${{ secrets.VERCEL_TEAM_ID }}
      SAIL_GTX_REPO_PAT:       ${{ secrets.SAIL_GTX_REPO_PAT }}
      SAIL_GTX_HEALTHCHECK_URL: ${{ vars.SAIL_GTX_HEALTHCHECK_URL }}
      SAIL_GTX_API_BASE:       ${{ vars.SAIL_GTX_API_BASE }}
      SAIL_GTX_API_AUTH_TOKEN: ${{ secrets.SAIL_GTX_API_AUTH_TOKEN }}
      PRODUCTION_BRANCH:       ${{ vars.SAIL_GTX_PRODUCTION_BRANCH }}
      SAIL_GTX_PRODUCTION_BRANCH: ${{ vars.SAIL_GTX_PRODUCTION_BRANCH }}
      # Inside the workspace so hashFiles() can see it (it cannot read /tmp).
      HTS_ENV_SNAPSHOT_PATH:   ${{ github.workspace }}/env-snapshot.json

    steps:
      # ────────────────────────────────────────────────────────────────
      # Setup (all-Python; mdbtools only for CA — the US USITC acquisition
      # was ported from R to scripts/hts_automation/usitc_native.py)
      # ────────────────────────────────────────────────────────────────
      - name: Checkout tariff-rate-tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mdbtools
        if: matrix.jurisdiction == 'CA'
        # ca.json system_requires: the CBSA .accdb export needs mdb-tables/mdb-export.
        run: sudo apt-get update && sudo apt-get install -y mdbtools

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/hts_automation/requirements.txt

      - name: Install Python packages
        run: pip install -r scripts/hts_automation/requirements.txt

      # ────────────────────────────────────────────────────────────────
      # Validate configuration before doing anything destructive.
      # CA/EU need no Railway/Vercel: their revisions resolve from Supabase
      # and their data deploys ride the sail-gtx branch push.
      # ────────────────────────────────────────────────────────────────
      - name: Validate config
        run: |
          missing=()
          [[ -z "${PRODUCTION_BRANCH}" ]] && missing+=("SAIL_GTX_PRODUCTION_BRANCH (vars)")
          [[ -z "${PINECONE_API_KEY}" ]] && missing+=("PINECONE_API_KEY (secrets)")
          [[ -z "${SUPABASE_URL}" ]] && missing+=("SUPABASE_URL (secrets)")
          [[ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]] && missing+=("SUPABASE_SERVICE_ROLE_KEY (secrets)")
          [[ -z "${SAIL_GTX_REPO_PAT}" ]] && missing+=("SAIL_GTX_REPO_PAT (secrets)")
          if [[ "${{ matrix.jurisdiction }}" == "US" ]]; then
            [[ -z "${SAIL_GTX_HEALTHCHECK_URL}" ]] && missing+=("SAIL_GTX_HEALTHCHECK_URL (vars)")
            [[ -z "${SAIL_GTX_API_BASE}" ]] && missing+=("SAIL_GTX_API_BASE (vars)")
            [[ -z "${RAILWAY_TOKEN}" ]] && missing+=("RAILWAY_TOKEN (secrets)")
            [[ -z "${RAILWAY_PROJECT_ID}" ]] && missing+=("RAILWAY_PROJECT_ID (secrets)")
            [[ -z "${RAILWAY_SERVICE_ID}" ]] && missing+=("RAILWAY_SERVICE_ID (secrets)")
            [[ -z "${RAILWAY_ENVIRONMENT_ID}" ]] && missing+=("RAILWAY_ENVIRONMENT_ID (secrets)")
            [[ -z "${VERCEL_TOKEN}" ]] && missing+=("VERCEL_TOKEN (secrets)")
            [[ -z "${VERCEL_PROJECT_ID}" ]] && missing+=("VERCEL_PROJECT_ID (secrets)")
          fi
          if (( ${#missing[@]} )); then
            printf 'Missing required config: %s\n' "${missing[@]}"
            exit 1
          fi
          echo "config ok (${{ matrix.jurisdiction }}); production branch = ${PRODUCTION_BRANCH}"

      # ────────────────────────────────────────────────────────────────
      # The rollout. --if-new is the idempotency gate: refresh.py checks the
      # upstream source (USITC scrape / CBSA menu page / CIRCABC folder list)
      # against the latest revision registered in Supabase and exits 0 in
      # seconds when there is nothing new, emitting gate=skip. A US
      # revision_id override bypasses the gate (as before).
      # ────────────────────────────────────────────────────────────────
      - name: Run rollout (refresh.py)
        id: rollout
        run: |
          set -euo pipefail
          args=(--jurisdiction "${{ matrix.jurisdiction }}" --if-new)
          if [[ "${{ matrix.jurisdiction }}" == "US" && -n "${{ inputs.revision_id }}" ]]; then
            args=(--jurisdiction US --revision "${{ inputs.revision_id }}" --skip-scrape)
          fi
          [[ "${{ inputs.dry_run }}" == "true" ]] && args+=(--dry-run)
          [[ "${{ matrix.jurisdiction }}" == "US" && "${{ inputs.skip_smoke_classify }}" == "false" ]] && args+=(--run-classify)
          python3 scripts/hts_automation/refresh.py "${args[@]}"

      - name: Upload env snapshot (for rollback)
        if: always() && matrix.jurisdiction == 'US' && steps.rollout.outputs.gate == 'proceed' && !inputs.dry_run && hashFiles('env-snapshot.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: env-snapshot-${{ github.run_id }}
          path: env-snapshot.json
          retention-days: 7

      # ────────────────────────────────────────────────────────────────
      # Rollback path (US only — CA/EU touch no deploy env vars).
      # ────────────────────────────────────────────────────────────────
      - name: Rollback env vars
        if: failure() && matrix.jurisdiction == 'US' && hashFiles('env-snapshot.json') != ''
        run: |
          python3 scripts/hts_automation/update_env_vars.py revert \
            --snapshot "${HTS_ENV_SNAPSHOT_PATH}"

      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `HTS Revision Update failed — ${{ matrix.jurisdiction }} (${process.env.PRODUCTION_BRANCH})`,
              body: `Run: ${runUrl}\n\nThe automated ${{ matrix.jurisdiction }} HTS revision rollout failed. Env vars were rolled back if a snapshot existed (US); the Pinecone namespace + Supabase row may need manual inspection. Resume locally with:\n\n    python3 scripts/hts_automation/refresh.py -j ${{ matrix.jurisdiction }} --from-step <step>`,
              labels: ['hts-automation', 'incident']
            });

      # ────────────────────────────────────────────────────────────────
      # Commit the per-jurisdiction registry back on success so the repo
      # records what was rolled out. Corpus artifacts stay gitignored
      # (large, regeneratable); the acquired source CSVs for CA/EU are
      # tracked so a laptop clone can resume/verify offline.
      # ────────────────────────────────────────────────────────────────
      - name: Commit registry on success
        if: success() && steps.rollout.outputs.gate == 'proceed' && !inputs.dry_run
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          case "${{ matrix.jurisdiction }}" in
            US) git add config/revision_dates.csv ;;
            CA) git add config/jurisdictions/ca_revisions.csv data/ca_tariff_source/*.csv ;;
            EU) git add config/jurisdictions/eu_revisions.csv data/eu_tariff_source/*.csv ;;
            GB) git add config/jurisdictions/gb_revisions.csv data/gb_tariff_source/*.csv data/gb_tariff_source/state.json ;;
            XI) git add config/jurisdictions/xi_revisions.csv data/xi_tariff_source/*.csv ;;
          esac
          if git diff --cached --quiet; then
            echo "registry unchanged — nothing to commit"
          else
            git commit -m "data: ${{ matrix.jurisdiction }} HTS ${{ steps.rollout.outputs.YEAR }} Rev ${{ steps.rollout.outputs.REV_NUM }} (effective ${{ steps.rollout.outputs.EFFECTIVE_DATE }})"
            # A previous matrix leg may have pushed; we're on the trigger SHA.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
