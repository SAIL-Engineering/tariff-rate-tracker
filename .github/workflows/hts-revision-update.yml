name: HTS Revision Update

# What this does:
#   - Detect new US HTS revisions from USITC (01_scrape_revision_dates.R).
#   - If a new row landed and passes sanity checks, run the SAME orchestrator
#     the laptop runs — scripts/hts_automation/refresh.py --jurisdiction US —
#     which downloads both formats, builds the corpus, swaps the Pinecone
#     namespace, upserts Supabase, commits the JSON to sail-gtx-prerelease,
#     updates Railway + Vercel env vars, and smoke-tests (rolling back env
#     vars itself on smoke failure). One pipeline, not a third inline copy:
#     the previous version re-implemented steps 4-9 here and drifted.
#
# Triggers:
#   - cron "0 6,7 * * *"  → daily, 2 AM local in both DST regimes
#   - workflow_dispatch   → manual run, with optional revision_id override

on:
  schedule:
    # Daily. GitHub cron is UTC-only, so 07:00 UTC is 2 AM EST but 3 AM EDT —
    # both hours are scheduled so the run lands at 2 AM local year-round. The
    # `gate` step exits clean when revision_dates.csv is unchanged, so the
    # redundant run costs seconds, and `concurrency` prevents overlap.
    - cron: '0 6,7 * * *'
  workflow_dispatch:
    inputs:
      revision_id:
        description: 'Optional revision ID override, e.g. 2026_rev_8'
        required: false
        default: ''
      dry_run:
        description: 'Run in dry-run mode (no external writes)'
        type: boolean
        default: false
      skip_smoke_classify:
        description: 'Skip the canary POST /api/classify in smoke test'
        type: boolean
        default: true

permissions:
  contents: write      # commit revision_dates.csv + archives back to this repo
  issues: write        # open an issue on failure

concurrency:
  group: hts-revision-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PINECONE_API_KEY:        ${{ secrets.PINECONE_API_KEY }}
      SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RAILWAY_TOKEN:           ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID:      ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID:      ${{ secrets.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT_ID:  ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
      VERCEL_TOKEN:            ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID:       ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID:          ${{ secrets.VERCEL_TEAM_ID }}
      SAIL_GTX_REPO_PAT:       ${{ secrets.SAIL_GTX_REPO_PAT }}
      SAIL_GTX_HEALTHCHECK_URL: ${{ vars.SAIL_GTX_HEALTHCHECK_URL }}
      SAIL_GTX_API_BASE:       ${{ vars.SAIL_GTX_API_BASE }}
      SAIL_GTX_API_AUTH_TOKEN: ${{ secrets.SAIL_GTX_API_AUTH_TOKEN }}
      PRODUCTION_BRANCH:       ${{ vars.SAIL_GTX_PRODUCTION_BRANCH }}
      SAIL_GTX_PRODUCTION_BRANCH: ${{ vars.SAIL_GTX_PRODUCTION_BRANCH }}
      HTS_ENV_SNAPSHOT_PATH:   /tmp/env-snapshot.json

    steps:
      # ────────────────────────────────────────────────────────────────
      # Setup
      # ────────────────────────────────────────────────────────────────
      - name: Checkout tariff-rate-tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install R packages
        # No DESCRIPTION/renv.lock in this repo today; install the small set
        # of packages this workflow needs directly. Public RSPM (set above)
        # serves pre-compiled binaries on Ubuntu so this takes ~30s, not
        # the multi-minute source compile path.
        run: |
          Rscript -e 'install.packages(c("tidyverse", "jsonlite", "here", "digest"))'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/hts_automation/requirements.txt

      - name: Install Python packages
        run: pip install -r scripts/hts_automation/requirements.txt

      # ────────────────────────────────────────────────────────────────
      # Validate workflow configuration before doing anything destructive
      # ────────────────────────────────────────────────────────────────
      - name: Validate config
        run: |
          missing=()
          [[ -z "${PRODUCTION_BRANCH}" ]] && missing+=("SAIL_GTX_PRODUCTION_BRANCH (vars)")
          [[ -z "${SAIL_GTX_HEALTHCHECK_URL}" ]] && missing+=("SAIL_GTX_HEALTHCHECK_URL (vars)")
          [[ -z "${PINECONE_API_KEY}" ]] && missing+=("PINECONE_API_KEY (secrets)")
          [[ -z "${SUPABASE_URL}" ]] && missing+=("SUPABASE_URL (secrets)")
          [[ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]] && missing+=("SUPABASE_SERVICE_ROLE_KEY (secrets)")
          [[ -z "${RAILWAY_TOKEN}" ]] && missing+=("RAILWAY_TOKEN (secrets)")
          [[ -z "${VERCEL_TOKEN}" ]] && missing+=("VERCEL_TOKEN (secrets)")
          [[ -z "${SAIL_GTX_REPO_PAT}" ]] && missing+=("SAIL_GTX_REPO_PAT (secrets)")
          if (( ${#missing[@]} )); then
            printf 'Missing required config: %s\n' "${missing[@]}"
            exit 1
          fi
          echo "config ok; production branch = ${PRODUCTION_BRANCH}"

      # ────────────────────────────────────────────────────────────────
      # Step 1: discover new revisions (or honor the workflow_dispatch input)
      # ────────────────────────────────────────────────────────────────
      - name: Scrape USITC for new revisions
        id: scrape
        run: |
          set -euo pipefail
          # Snapshot pre-scrape so we can detect a real diff afterwards.
          cp config/revision_dates.csv /tmp/revision_dates.before.csv
          Rscript src/01_scrape_revision_dates.R --auto-clear-review || true
          if diff -q /tmp/revision_dates.before.csv config/revision_dates.csv >/dev/null; then
            echo "revision_dates.csv unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "revision_dates.csv was updated:"
            diff /tmp/revision_dates.before.csv config/revision_dates.csv || true
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to continue
        id: gate
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.revision_id }}" ]]; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
            echo "Manual revision_id override: ${{ inputs.revision_id }}"
          elif [[ "${{ steps.scrape.outputs.changed }}" == "true" ]]; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
            echo "Continuing — new revision detected"
          else
            echo "continue=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — exiting clean"
          fi

      # ────────────────────────────────────────────────────────────────
      # Resolve the target revision (read-only) — feeds the commit-back
      # message; the rollout itself re-resolves inside refresh.py.
      # ────────────────────────────────────────────────────────────────
      - name: Resolve target revision
        if: steps.gate.outputs.continue == 'true'
        id: target
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.revision_id }}" ]]; then
            output=$(Rscript scripts/hts_automation/latest_revision.R --revision "${{ inputs.revision_id }}")
          else
            output=$(Rscript scripts/hts_automation/latest_revision.R)
          fi
          echo "$output"
          echo "$output" >> "$GITHUB_OUTPUT"

      # ────────────────────────────────────────────────────────────────
      # The rollout: the SAME spec-driven orchestrator run_locally.sh wraps.
      # config/jurisdictions/us.json declares the steps
      # (acquire → build → publish → register → ship → envvars → smoke);
      # --skip-scrape because the gate step above already scraped. On smoke
      # failure refresh.py reverts the env vars from the snapshot itself and
      # exits 9; the artifact + issue steps below still fire via failure().
      # ────────────────────────────────────────────────────────────────
      - name: Run US rollout (refresh.py)
        if: steps.gate.outputs.continue == 'true'
        run: |
          set -euo pipefail
          args=(--jurisdiction US --skip-scrape)
          [[ -n "${{ inputs.revision_id }}" ]] && args+=(--revision "${{ inputs.revision_id }}")
          [[ "${{ inputs.dry_run }}" == "true" ]] && args+=(--dry-run)
          [[ "${{ inputs.skip_smoke_classify }}" != "true" ]] && args+=(--run-classify)
          python3 scripts/hts_automation/refresh.py "${args[@]}"

      - name: Upload env snapshot (for rollback)
        if: always() && steps.gate.outputs.continue == 'true' && !inputs.dry_run && hashFiles('/tmp/env-snapshot.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: env-snapshot-${{ github.run_id }}
          path: /tmp/env-snapshot.json
          retention-days: 7

      # ────────────────────────────────────────────────────────────────
      # Step 10: rollback path. Runs only if a previous step in this job failed.
      # ────────────────────────────────────────────────────────────────
      - name: Rollback env vars
        if: failure() && steps.gate.outputs.continue == 'true' && hashFiles('/tmp/env-snapshot.json') != ''
        run: |
          python3 scripts/hts_automation/update_env_vars.py revert \
            --snapshot /tmp/env-snapshot.json

      - name: Open failure issue
        if: failure() && steps.gate.outputs.continue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `HTS Revision Update failed (${process.env.PRODUCTION_BRANCH})`,
              body: `Run: ${runUrl}\n\nThe automated HTS revision rollout failed. Env vars were rolled back if a snapshot existed; the Pinecone namespace + Supabase row may need manual inspection.`,
              labels: ['hts-automation', 'incident']
            });

      # ────────────────────────────────────────────────────────────────
      # Step 11: commit revision_dates.csv + archives back to this repo (on success)
      # ────────────────────────────────────────────────────────────────
      - name: Commit revision_dates.csv on success
        if: success() && steps.gate.outputs.continue == 'true' && !inputs.dry_run
        # Archive JSON/CSV files are intentionally gitignored in this repo
        # (large, regeneratable). We only commit the curated revision_dates.csv
        # so the next run knows what's been processed.
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/revision_dates.csv
          if git diff --cached --quiet; then
            echo "revision_dates.csv unchanged — nothing to commit"
          else
            git commit -m "data: HTS ${{ steps.target.outputs.YEAR }} Rev ${{ steps.target.outputs.REV_NUM }} (effective ${{ steps.target.outputs.EFFECTIVE_DATE }})"
            git push
          fi
